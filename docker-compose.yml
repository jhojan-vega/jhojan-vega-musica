services:
  public-web:
    build: { context: ., dockerfile: apps/public-web/Dockerfile }
    restart: unless-stopped
  media-init:
    image: node:22-alpine
    volumes:
      - media-data:/media
      - ./infra/docker/media/initial:/seed:ro
    command: >
      sh -c 'if [ -z "$$(find /media -mindepth 1 -print -quit)" ]; then cp -a /seed/. /media/; fi'
    restart: "no"
  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media-data:/data/media:ro
    depends_on: [public-web, media-init]
    restart: unless-stopped
volumes:
  media-data:
