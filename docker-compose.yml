services:
  public-web:
    build: { context: ., dockerfile: apps/public-web/Dockerfile }
    restart: unless-stopped
  admin-web:
    build: { context: ., dockerfile: apps/admin-web/Dockerfile }
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: .env
    environment:
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes: [media-data:/data/media]
    depends_on:
      postgres: { condition: service_healthy }
      media-init: { condition: service_completed_successfully }
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  media-init:
    image: alpine:3.21
    volumes:
      - media-data:/media
      - ./infra/docker/media/initial:/seed:ro
    command: >
      sh -c 'if [ -z "$$(find /media -mindepth 1 -print -quit)" ]; then cp -a /seed/. /media/; fi'
    restart: "no"
  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media-data:/data/media:ro
    depends_on: [public-web, admin-web, api, media-init]
    restart: unless-stopped
volumes:
  postgres-data:
  media-data:
